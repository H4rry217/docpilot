spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mongodb:
    host: 127.0.0.1
    port: 27017
    database: docpilot-test

docpilot:
  id:
    datacenter-id: 1
    machine-id: 1

  workspace:
    mongo:
      init-indexes: false

  auth:
    default-user:
      password-iterations: 100000
      datasource:
        url: jdbc:h2:mem:docpilot;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
        username: sa
        password:
